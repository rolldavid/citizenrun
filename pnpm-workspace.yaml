packages:
  - apps/*
  - packages/*
  - pipeline

# One version of each shared dependency (D-110). A manifest refers to an entry as "catalog:".
catalog:
  typescript: ~6.0.3
  '@types/node': ^24.0.0
  zod: ^4.6.7
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ~19.3.0
  vitest: ^5.1.0
  tsx: ^4.0.0
  esbuild: ^0.27.0
  '@tanstack/react-query': ^5.107.1
  uuid: ^14.0.3
  i18next: ^27.0.0
  pg: ^8.23.1
  pg-boss: ^12.38.2
  '@aws-sdk/client-s3': ^3.1169.0
  drizzle-orm: 1.0.0-rc.5 # exact, no caret (D-235); both lines change together under C1
  drizzle-kit: 1.0.0-rc.5

# Dependency build scripts are blocked unless listed here (D-110). strictDepBuilds stays at its default, true.
allowBuilds:
  esbuild: true # installs its platform binary
  '@railway/cli': true # downloads the CLI binary the scripts call

# Force one copy across the tree: a second TypeScript, React or React Native breaks lint, hooks and native builds.
overrides:
  typescript: 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'
  # eslint-config-expo registers its own @typescript-eslint plugin; ESLint refuses two instances.
  '@typescript-eslint/eslint-plugin': 8.72.2
  '@typescript-eslint/parser': 8.72.2

engineStrict: true
