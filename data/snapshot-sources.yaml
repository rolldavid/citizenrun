# Raw candidate lists the snapshot archiver saves each day; a value in <...> is still to be recorded.
- source: nc-sbe
  state: NC
  always: true
  recipe:
    kind: discover_get
    page: https://www.ncsbe.gov/results-data/candidate-lists
    link_pattern: 'Candidate_Listing_\d{4}\.csv$'

- source: wa-sos
  state: WA
  always: true
  recipe:
    kind: playwright_export
    url: https://voter.votewa.gov/CandidateList.aspx?e={election_id}
    election_ids_from: https://voter.votewa.gov/CandidateList.aspx
    export_button_text: Export to CSV

- source: la-sos
  state: LA
  always: true
  recipe:
    kind: playwright_export
    url: https://voterportal.sos.la.gov/candidateinquiry
    export_button_text: '<none usable: the export needs offices or a parish chosen first>'

- source: va-elections
  state: VA
  always: true
  recipe:
    kind: get
    url: https://www.elections.virginia.gov/casting-a-ballot/candidate-list/november-3-2026-gen-elect-all-offices/

