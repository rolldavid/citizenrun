  licence_spdx: null
  attribution: null
  robots_checked_on: 2026-11-26
  ci_status: unknown
  notes: robots.txt of www.elections.virginia.gov disallows *.json, *.csv, *.xls and *.xlsx, and allows /casting-a-ballot/candidate-list/. The snapshot archives the all-offices list page of the next general election (november-3-2026-gen-elect-all-offices on 2026-11-26), an HTML page; the recipe moves to the next election's page when it is published.

