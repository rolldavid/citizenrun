special_districts:
  # Chapter 139: three elective supervisors in each county of the district, two appointive (G.S. 139-7).
  - key: soil-water-conservation-district
    enabling_statute:
      value: G.S. Chapter 139 (Soil and Water Conservation Districts)
      source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_139/GS_139-6.html
      quote: 'After the issuance of the certificate of organization of the soil and water conservation district by the Secretary of State, an election shall be held in each county of the district to elect the members of the soil and water conservation district board of supervisors as herein provided.'
      citation: G.S. 139-6
    elected:
      value: true
      source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_139/GS_139-6.html
      quote: 'The district board of supervisors shall consist of three elective members to be elected in each county of the district, and that number of appointive members as provided in G.S. 139-7.'
      citation: G.S. 139-6
    classifier:
      function_names: ['88 - SOIL AND WATER CONSERVATION']
      name_patterns: []
    offices:
      - key: soil-water-supervisor
        office_type: soil-water-conservation-board
        applies_to: null
        title: '{jurisdiction} Board of Supervisors'
        seats:
          arrangement: at_large
          count:
            value: 3
            source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_139/GS_139-6.html
            quote: 'The district board of supervisors shall consist of three elective members to be elected in each county of the district'
            citation: G.S. 139-6
          district_count: null
          label_pattern: null
        # The three elective seats; the two appointive members of G.S. 139-7 are not elected.
        body_size:
          value: 3
          source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_139/GS_139-6.html
          quote: 'The district board of supervisors shall consist of three elective members to be elected in each county of the district'
          citation: G.S. 139-6
        # From November 1974 two seats for four years and one for two years, then four-year terms.
        stagger:
          - { group: A, seats: 2, every: 4, first: 1990 }
          - { group: B, seats: 1, every: 4, first: 1992 }
        term_years:
          value: 4
          source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_139/GS_139-6.html
          quote: 'Beginning with the election to be held in November 1974, the two candidates receiving the highest number of votes shall be elected for a term of four years, and the candidate receiving the next highest number of votes shall be elected for a term of two years; thereafter, as their terms expire, their successors shall be elected for terms of four years.'
          citation: G.S. 139-6
        term_limit_terms: null
        schedule: nc_soil_water
        track_set: nc_soil_water
        partisan:
          value: false
          source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_139/GS_139-6.html
          quote: 'The election shall be nonpartisan and no primary election shall be held.'
          citation: G.S. 139-6
        powers: []
        pay: null
        pay_range: null
        benefits: null
        eligibility: []
        job_restrictions: []
        district: null
        wikidata_position: null
        roster_url: null
  # Water and sewer authorities (Chapter 162A, Article 1): members appointed by the member governments.
  - key: water-sewer-authority
    enabling_statute:
      value: G.S. Chapter 162A, Article 1 (Water and Sewer Authorities)
      source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_162A/GS_162A-5.html
      quote: 'Each authority organized under this Article shall consist of the number of members as may be agreed upon by the participating political subdivisions, such members to be selected by the respective political subdivision.'
      citation: G.S. 162A-5(a)
    elected:
      value: false
      source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_162A/GS_162A-5.html
      quote: 'Appointments of successor members shall, in each instance, be made by the governing body of the political subdivision appointing the member whose successor is to be appointed.'
      citation: G.S. 162A-5(a)
    classifier:
      function_names:
        ['91 - WATER SUPPLY UTILITY', '98 - SEWERAGE AND WATER SUPPLY', '80 - SEWERAGE']
      name_patterns: ['\bauthority\b']
    offices: []
  # Hospital authorities (Chapter 131E, Article 2): commissioners appointed.
  - key: hospital-authority
    enabling_statute:
      value: G.S. Chapter 131E, Article 2 (Hospital Authorities Act)
      source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_131E/GS_131E-17.html
      quote: 'A hospital authority may be created whenever a city council or a county board of commissioners finds and adopts a resolution finding that it is in the interest of the public health and welfare to create a hospital authority.'
      citation: G.S. 131E-17(a)
    elected:
      value: false
      source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_131E/GS_131E-17.html
      quote: 'After the adoption of a resolution creating a hospital authority, the mayor or the chairman of the county board of commissioners shall appoint commissioners in accordance with G.S. 131E-18.'
      citation: G.S. 131E-17(b)
    classifier:
      function_names: ['40 - HOSPITALS']
      name_patterns: ['\bauthority\b']
    offices: []
  # Housing authorities (Chapter 157): commissioners appointed by the mayor.
  - key: housing-authority
    enabling_statute:
      value: G.S. Chapter 157 (Housing Authorities and Projects)
      source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_157/GS_157-5.html
      quote: 'An authority shall consist of not less than five nor more than eleven commissioners appointed by the mayor and the mayor shall designate the first chair.'
      citation: G.S. 157-5(a)
    elected:
      value: false
      source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_157/GS_157-5.html
      quote: 'An authority shall consist of not less than five nor more than eleven commissioners appointed by the mayor and the mayor shall designate the first chair.'
      citation: G.S. 157-5(a)
    classifier:
      function_names: ['50 - HOUSING AND COMMUNITY DEVELOPMENT']
      name_patterns: ['housing authority']
    offices: []
  # Area authorities for mental health services (Chapter 122C, Article 4): boards appointed by the counties.
  - key: area-authority
    enabling_statute:
      value: G.S. Chapter 122C, Article 4 (area authorities)
      source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_122C/GS_122C-118.1.html
      quote: 'An area board shall have no fewer than 11 and no more than 21 voting members.'
      citation: G.S. 122C-118.1(a)
    elected:
      value: false
      source_url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_122C/GS_122C-118.1.html
      quote: 'The board of county commissioners, or the boards of county commissioners within the area, shall appoint members consistent with the requirements provided in subsection (b) of this section.'
      citation: G.S. 122C-118.1(a)
