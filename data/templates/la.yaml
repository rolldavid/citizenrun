      # The consolidated government of the City of Baton Rouge and the Parish of East Baton Rouge.
      - key: ebr-mayor-president
        office_type: mayor
        applies_to:
          { name_pattern: '^Baton Rouge city$', population_min: null, population_max: null }
        title: Mayor-President of the City of Baton Rouge and Parish of East Baton Rouge
        seats:
          arrangement: at_large
          count:
            value: 1
            source_url: https://www.brla.gov/1266/Chapter-4-Mayor-President
            quote: 'The Chief Executive Officer of the City and Parish shall be a Mayor-President who shall be elected by the qualified voters of the Parish at the same time and for the same terms as the members of the Metropolitan Council'
            citation: East Baton Rouge Plan of Government, §4.01
          district_count: null
          label_pattern: null
        body_size: null
        stagger: []
        term_years:
          value: 4
          source_url: https://www.brla.gov/1266/Chapter-4-Mayor-President
          quote: 'Thereafter the Mayor-President shall hold office for a term of four years beginning on the first day of January following his election.'
          citation: East Baton Rouge Plan of Government, §4.01
        term_limit_terms:
          value: 3
          source_url: https://www.brla.gov/1266/Chapter-4-Mayor-President
          quote: 'A person who has been elected to serve as Mayor-President of the Consolidated Government of the City of Baton Rouge and Parish of East Baton Rouge for three (3) consecutive full terms of office, such service being during a term of office that began on or after January 1, 1997, shall not be eligible for election as Mayor-President'
          citation: East Baton Rouge Plan of Government, §4.01
        schedule: la_congressional
        track_set: la_qualifying
        partisan: null
        powers: []
        pay: null
        pay_range: null
        benefits: null
        eligibility: []
        job_restrictions: []
        district: { county_union: east-baton-rouge-parish }
        wikidata_position: null
        roster_url: null
      - key: ebr-metropolitan-council
        office_type: city-council
        applies_to:
          { name_pattern: '^Baton Rouge city$', population_min: null, population_max: null }
        title: 'Metropolitan Council of the Parish of East Baton Rouge and the City of Baton Rouge, {label}'
        seats:
          arrangement: by_district
          count: null
          district_count:
            value: 12
            source_url: https://www.brla.gov/1264/Chapter-2-Governing-Bodies
            quote: 'On and after January l, l985, the Metropolitan Council shall consist of twelve (l2) persons elected from l2 single member districts within the Parish of East Baton Rouge'
            citation: East Baton Rouge Plan of Government, §2.01(b)
          label_pattern: 'District {n}'
        body_size:
          value: 12
          source_url: https://www.brla.gov/1264/Chapter-2-Governing-Bodies
          quote: 'On and after January l, l985, the Metropolitan Council shall consist of twelve (l2) persons elected from l2 single member districts within the Parish of East Baton Rouge'
          citation: East Baton Rouge Plan of Government, §2.01(b)
        stagger: []
        term_years:
          value: 4
          source_url: https://www.brla.gov/1264/Chapter-2-Governing-Bodies
          quote: 'The members of the Metropolitan Council shall thereafter be nominated and elected in l984 and every fourth year thereafter at the same time as representatives in Congress of the United States and shall hold office for terms of four years from the first day of January following their election'
          citation: East Baton Rouge Plan of Government, §2.02
        term_limit_terms:
          value: 3
          source_url: https://www.brla.gov/1264/Chapter-2-Governing-Bodies
          quote: 'A person who has been elected to serve as a member of the Metropolitan Council of the Parish of East Baton Rouge and City of Baton Rouge, the governing authority of the Parish of East Baton Rouge and City of Baton Rouge, for three (3) consecutive full terms of office, such service being during a term of office that began on or after January 1, 1997, shall not be eligible for election to the Metropolitan Council'
          citation: East Baton Rouge Plan of Government, §2.02
        schedule: la_congressional
        track_set: la_qualifying
        partisan: null
        powers: []
        pay:
