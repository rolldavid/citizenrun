  - key: water-and-waste-authority
    enabling_statute:
      value: Water and waste authorities established by ordinance or resolution
      source_url: https://www.census.gov/content/dam/Census/library/publications/2024/econ/2022ISD.pdf
      quote: They are established by ordinance or resolution of any one or more counties or municipalities after public hearing.
      citation: 'U.S. Census Bureau, Individual State Descriptions: 2022, Virginia'
    elected:
      value: false
      source_url: https://www.census.gov/content/dam/Census/library/publications/2024/econ/2022ISD.pdf
      quote: Each authority is governed by a board consisting of one or more members representing each locality, as determined by the articles of incorporation.
      citation: 'U.S. Census Bureau, Individual State Descriptions: 2022, Virginia'
    classifier:
      function_names:
        - 91 - WATER SUPPLY UTILITY
        - 98 - SEWERAGE AND WATER SUPPLY
        - 80 - SEWERAGE
        - 81 - SOLID WASTE MANAGEMENT
      name_patterns:
        - \bauthority\b
    offices: []
  - key: hospital-authority
    enabling_statute:
      value: Hospital authorities established by a city council or county governing body
      source_url: https://www.census.gov/content/dam/Census/library/publications/2024/econ/2022ISD.pdf
      quote: A city council or county governing body may, on its own initiative or upon voter petition, establish a hospital authority to provide and operate hospitals.
      citation: 'U.S. Census Bureau, Individual State Descriptions: 2022, Virginia'
    elected:
      value: false
      source_url: https://www.census.gov/content/dam/Census/library/publications/2024/econ/2022ISD.pdf
      quote: A board of commissioners (appointed by the mayor or county governing body) governs each authority.
      citation: 'U.S. Census Bureau, Individual State Descriptions: 2022, Virginia'
    classifier:
      function_names:
        - 40 - HOSPITALS
      name_patterns:
        - \bhospital authority\b
    offices: []
  - key: airport-authority
    enabling_statute:
      value: Airport authorities and commissions established by special act
      source_url: https://www.census.gov/content/dam/Census/library/publications/2024/econ/2022ISD.pdf
      quote: Airport authorities and commissions may be established by special act.
      citation: 'U.S. Census Bureau, Individual State Descriptions: 2022, Virginia'
    elected:
      value: false
      source_url: https://www.census.gov/content/dam/Census/library/publications/2024/econ/2022ISD.pdf
      quote: A board appointed by the participating local governments governs each of the airport authorities, except for the Blue Ridge Airport Authority’s board which is appointed by the circuit judge.
      citation: 'U.S. Census Bureau, Individual State Descriptions: 2022, Virginia'
    classifier:
      function_names:
        - 01 - AIR TRANSPORTATION
      name_patterns: []
    offices: []
  - key: regional-jail-authority
    enabling_statute:
      value: Jail authorities created by concurrent resolutions (1990 law)
      source_url: https://www.census.gov/content/dam/Census/library/publications/2024/econ/2022ISD.pdf
      quote: They may be created by concurrent resolutions of the governing bodies of two or more counties, cities, or combinations of both.
      citation: 'U.S. Census Bureau, Individual State Descriptions: 2022, Virginia'
    elected:
      value: false
      source_url: https://www.census.gov/content/dam/Census/library/publications/2024/econ/2022ISD.pdf
      quote: A board (consisting of appointed representatives and the sheriff of the member governments) governs each authority.
      citation: 'U.S. Census Bureau, Individual State Descriptions: 2022, Virginia'
    classifier:
      function_names:
        - 04 - CORRECTIONAL INSTITUTIONS
      name_patterns:
        - \bjail authority\b
    offices: []
  - key: richmond-metropolitan-transportation-authority
    enabling_statute:
      value: The 1966 special act of the Richmond Metropolitan Transportation Authority
      source_url: https://www.census.gov/content/dam/Census/library/publications/2024/econ/2022ISD.pdf
      quote: It was established by a 1966 special act.
      citation: 'U.S. Census Bureau, Individual State Descriptions: 2022, Virginia'
    elected:
      value: false
      source_url: https://www.census.gov/content/dam/Census/library/publications/2024/econ/2022ISD.pdf
      quote: 'A 16-member board of directors governs the authority: five members appointed by the boards of county supervisors of the counties of Chesterfield and Henrico; four members appointed by the mayor of the city of Richmond'
      citation: 'U.S. Census Bureau, Individual State Descriptions: 2022, Virginia'
    classifier:
      function_names:
        - 45 - TOLL HIGHWAYS
      name_patterns:
        - ^Richmond Metropolitan Transportation Authority$
    offices: []

