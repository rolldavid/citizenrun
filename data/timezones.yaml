# The IANA time zone of each state and of each county the federal time zone regulation places in another zone.
- state: NC
  default: America/New_York
  county_overrides: []
  source_url: https://www.govinfo.gov/content/pkg/CFR-2025-title49-vol1/xhtml/CFR-2025-title49-vol1-sec71-4.html
  quote: The second zone, the eastern standard time zone, includes that part of the United States that is west of 67°30″ W. longitude and east of the boundary line described in § 71.5, and includes all of the State of Maine, but does not include any part of the Commonwealth of Puerto Rico.
  citation: 49 CFR 71.4

- state: WA
  default: America/Los_Angeles
  county_overrides: []
  source_url: https://www.govinfo.gov/content/pkg/CFR-2025-title49-vol1/xhtml/CFR-2025-title49-vol1-sec71-10.html
  quote: The fifth zone, the Pacific standard time zone, includes that part of the continental United States that is west of the boundary line between the mountain and Pacific standard time zones described in § 71.9, but does not include any part of the State of Alaska.
  citation: 49 CFR 71.10

- state: TX
  default: America/Chicago
  county_overrides:
    - { county_geoid: '48141', zone: America/Denver }
    - { county_geoid: '48229', zone: America/Denver }
  source_url: https://www.govinfo.gov/content/pkg/CFR-2025-title49-vol1/xhtml/CFR-2025-title49-vol1-sec71-7.html
  quote: From the junction of the Kansas-Colorado boundary with the northern boundary of the State of Oklahoma westerly along the Colorado-Oklahoma boundary to the northwest corner of the State of Oklahoma; thence southerly along the west boundary of the State of Oklahoma and the west boundary of the State of Texas to the southeast corner of the State of New Mexico; thence westerly along the Texas-New Mexico boundary to the east line of Hudspeth County, Tex.; thence southerly along the east line of Hudspeth County, Tex., to the boundary between the United States and Mexico.
  citation: 49 CFR 71.7

- state: LA
  default: America/Chicago
  county_overrides: []
  source_url: https://www.govinfo.gov/content/pkg/CFR-2025-title49-vol1/xhtml/CFR-2025-title49-vol1-sec71-6.html
  quote: The third zone, the central standard time zone, includes that part of the United States that is west of the boundary line between the eastern and central standard time zones described in § 71.5 and east of the boundary line between the central and mountain standard time zones described in § 71.7.
  citation: 49 CFR 71.6

- state: VA
  default: America/New_York
  county_overrides: []
  source_url: https://www.govinfo.gov/content/pkg/CFR-2025-title49-vol1/xhtml/CFR-2025-title49-vol1-sec71-4.html
  quote: The second zone, the eastern standard time zone, includes that part of the United States that is west of 67°30″ W. longitude and east of the boundary line described in § 71.5, and includes all of the State of Maine, but does not include any part of the Commonwealth of Puerto Rico.
  citation: 49 CFR 71.4
