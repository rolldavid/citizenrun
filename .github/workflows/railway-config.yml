name: railway-config

on:
  pull_request:
    branches: [main]
    paths: ['.railway/**', 'packages/shared/src/brand.ts']
  push:
    branches: [main]
    paths: ['.railway/**', 'packages/shared/src/brand.ts']
  workflow_dispatch:
    inputs:
      environment: { type: choice, options: [staging, production], required: true }
      mode: { type: choice, options: [plan, apply], required: true, default: plan }

permissions:
  contents: read

concurrency:
  group: railway-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  plan-staging:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.RAILWAY_STAGING_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup # installs the pinned railway SDK so railway/iac resolves
      - name: Plan
        env:
          RAILWAY_TOKEN: '${{ secrets.RAILWAY_TOKEN_STAGING }}'
        run: |
          set -o pipefail
          pnpm exec railway config plan --out railway-plan.json | tee "$RUNNER_TEMP/railway-plan.txt"
      # The apply job downloads the newest artifact of this name planned on the pull request's head.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: railway-plan-staging
          path: railway-plan.json
          if-no-files-found: error
      - name: Comment the plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "not a pull request number" >&2; exit 1; }
          marker='<!-- railway-config-plan -->'
          plan="$(sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/railway-plan.txt")"
          # A comment body holds at most 65,536 characters.
          if [ "${#plan}" -gt 60000 ]; then
            plan="${plan:0:60000}"$'\n'"... (cut; the full plan is the railway-plan-staging artifact)"
          fi
          body="$RUNNER_TEMP/railway-plan-comment.md"
          printf '%s\n' "$marker" '### Railway config plan: staging' '' \
            "Planned on \`$HEAD_SHA\`. Merging applies exactly this plan." '' '````text' "$plan" '````' > "$body"
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- railway-config-plan -->"))) | .id')"
          existing="${ids%%$'\n'*}"
          if [ -n "$existing" ]; then
            jq -n --rawfile body "$body" '{body: $body}' |
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input - > /dev/null
          else
            jq -n --rawfile body "$body" '{body: $body}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input - > /dev/null
          fi

  apply-staging:
    if: github.event_name == 'push' && vars.RAILWAY_STAGING_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    permissions: { contents: read, actions: read, pull-requests: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The plan reviewed on the merged pull request's head, fetched with gh, and applied with the
      # lockfile's CLI: no third-party action holds the token. Without --confirm-destructive the
      # CLI refuses a plan that deletes or replaces.
      - name: Download the reviewed plan
        id: reviewed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)] | first | .head.sha // empty')"
          if [ -z "$head_sha" ]; then
            # A commit fast-forwarded onto main has no reviewed plan; the change is applied by dispatch.
            echo "::notice::no merged pull request holds $GITHUB_SHA; apply this change with the dispatch form"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=railway-plan-staging&per_page=100" \
            --jq "[.artifacts[] | select(.workflow_run.head_sha == \"$head_sha\" and .expired == false)] | sort_by(.created_at) | last | .id // empty")"
          if [ -z "$artifact_id" ]; then
            echo "no railway-plan-staging artifact was planned on $head_sha; re-plan the pull request" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/railway-plan.zip"
          unzip -o "$RUNNER_TEMP/railway-plan.zip" railway-plan.json
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Apply the reviewed plan
        if: steps.reviewed.outputs.found == 'true'
        env:
          RAILWAY_TOKEN: '${{ secrets.RAILWAY_TOKEN_STAGING }}'
        run: pnpm exec railway config apply --plan railway-plan.json --yes

  dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Plan
        run: pnpm exec railway config plan --detailed-exit-code || [ $? -eq 2 ]
        env:
          RAILWAY_TOKEN: "${{ inputs.environment == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}"
      - name: Apply
        if: inputs.mode == 'apply'
        run: pnpm exec railway config apply --yes
        env:
          RAILWAY_TOKEN: "${{ inputs.environment == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_STAGING }}"
