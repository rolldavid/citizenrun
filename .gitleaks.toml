# Secret scanning for the CI `web` and `secrets` jobs and their local forms (CTL-25, INV-13).
# The default rules apply; the allow-list holds only the fixed local development and test values and
# paths.
title = "gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Local development values and saved fixtures"
condition = "OR"
regexes = [
  '''osdev-secret-key''',
  '''^0{64}$''',
  '''^(0123456789abcdef)+$''',
  # The second fixture secret of the handle tests, which rotate one key to another.
  '''^(fedcba9876543210)+$''',
  # File names of the throwaway keys tests generate at run time, such as rsa-fixture.p8.
  '''^[a-z0-9]+-fixture\.p8$''',
  # Source and office keys of the synthetic ZZ fixture world, such as zz-fixture-seat-001.
  '''^zz-[a-z0-9-]+$''',
  # The made-up API key of the photo tests.
  '''^fixture-api-key-[0-9]+$''',
]
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)__fixtures__/''',
]

[[allowlists]]
description = "Office template keys in the state templates and the rules tests that name them"
targetRules = ["generic-api-key"]
regexTarget = "match"
condition = "AND"
# A template key is lowercase words and numbers joined by hyphens, such as
# austin-council-district-2; no segment mixes letters and digits.
regexes = [
  '''^(key|templateKey): '?(?:[a-z]+|[0-9]+)(?:-(?:[a-z]+|[0-9]+))+'?$''',
]
paths = [
  '''^data/templates/[a-z]{2}\.yaml$''',
  '''^packages/rules/src/states/[a-z]{2}\.test\.ts$''',
]
