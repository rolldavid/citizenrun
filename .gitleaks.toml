# Secret scanning for the CI `web` and `secrets` jobs and their local forms (CTL-25, INV-13).
# The default rules apply; the allow-list holds only the fixed local development and test values and
# paths.
title = "gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Local development values and saved fixtures"
condition = "OR"
regexes = [
  '''osdev-secret-key''',
  '''^0{64}$''',
  '''^(0123456789abcdef)+$''',
  # The second fixture secret of the handle tests, which rotate one key to another.
  '''^(fedcba9876543210)+$''',
  # File names of the throwaway keys tests generate at run time, such as rsa-fixture.p8.
  '''^[a-z0-9]+-fixture\.p8$''',
]
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)__fixtures__/''',
]
